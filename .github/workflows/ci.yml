name: CMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
  security:
    uses: ./.github/workflows/reusable-security.yml
  release:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-release.yml
    secrets: inherit
  report-failure:
    name: Open issue on CI failure
    needs: [test, security, release]
    if: always() && (needs.test.result == 'failure' || needs.security.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const title = `CI failed on ${context.ref} (${context.sha.slice(0, 7)})`;
            const body = [
              'Automated CI failure report.',
              '',
              `- Repository: ${context.repo.owner}/${context.repo.repo}`,
              `- Ref: ${context.ref}`,
              `- Commit: ${context.sha}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Jobs:',
              `- test: ${process.env.TEST_RESULT}`,
              `- security: ${process.env.SECURITY_RESULT}`,
              `- release: ${process.env.RELEASE_RESULT}`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 20,
            });
            const found = existing.data.find((issue) => issue.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            } catch (error) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\n(label ci-failure missing)`,
              });
            }
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
