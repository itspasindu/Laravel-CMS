name: CMS CD

on:
  workflow_run:
    workflows: [CMS CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main-branch CI run containing release-bundle
        required: true
        type: string

permissions: {}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      ci-run-id: ${{ inputs.ci-run-id || format('{0}', github.event.workflow_run.id) }}
    secrets: inherit
  report-failure:
    name: Open issue on CD failure
    needs: [deploy]
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `CD failed (run ${context.runId})`;
            const body = [
              'Automated CD failure report.',
              '',
              `- Repository: ${context.repo.owner}/${context.repo.repo}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check deploy logs, smoke checks, permissions, and Nginx/PHP-FPM on staging.',
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cd-failure'],
              });
            } catch (error) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\n(label cd-failure missing)`,
              });
            }
