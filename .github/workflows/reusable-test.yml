name: CMS Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, gd, zip, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          cp .env.example .env
          touch database/database.sqlite
          composer validate --no-check-lock
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          php artisan migrate --force --no-interaction
          npm ci --no-audit
          npm run build
      - name: Check formatting and run tests
        run: |
          vendor/bin/pint --test
          php artisan test --log-junit test-results.xml
          node --test scripts/tests/release-trust.test.mjs
          bash scripts/tests/deployment.test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser smoke tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8000 >/tmp/artisan-serve.log 2>&1 &
          echo $! > /tmp/artisan-serve.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test
          kill "$(cat /tmp/artisan-serve.pid)" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Audit tested PHP dependencies
        run: composer audit --locked --no-dev
      - name: Install Syft for SBOM
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Package tested application
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          bash scripts/create-release-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7
