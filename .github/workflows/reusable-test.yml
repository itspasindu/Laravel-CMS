name: Reusable Laravel Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, gd, zip, bcmath
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        run: |
          cp .env.example .env
          composer validate --no-check-lock
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          npm ci --no-audit
          npm run build
      - name: Check formatting and run tests
        run: |
          vendor/bin/pint --test
          php artisan test --log-junit test-results.xml
          node --test scripts/tests/release-trust.test.mjs
          bash scripts/tests/deployment.test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - name: Audit tested PHP dependencies
        run: composer audit --locked --no-dev
      - name: Package tested application
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          bash scripts/create-release-bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7
