name: CMS Deploy

on:
  workflow_call:
    inputs:
      ci-run-id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      DEPLOY_ROOT: ${{ vars.STAGING_DEPLOY_ROOT || '/opt/dummy-cms' }}
      # Prefer environment variable; accept secret fallback if set in the wrong place.
      HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || secrets.STAGING_HEALTH_URL }}
      HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_USER: ${{ secrets.STAGING_USER }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - name: Check deploy configuration
        run: |
          set -euo pipefail
          if [[ -z "${HEALTH_URL:-}" ]]; then
            echo 'STAGING_HEALTH_URL is empty.'
            echo 'Add it under Settings → Environments → staging → Environment variables'
            echo 'Name: STAGING_HEALTH_URL'
            echo 'Value example: http://100.81.116.121/'
            echo 'It must be a Variable (not a Secret), and must start with http:// or https://'
            exit 1
          fi
          if [[ ! "$HEALTH_URL" =~ ^https?:// ]]; then
            echo 'STAGING_HEALTH_URL must start with http:// or https://'
            exit 1
          fi
          echo 'STAGING_HEALTH_URL is present and looks like a URL'
      # Always use trusted deployment code from main, never a PR artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate source run and signed archive
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.ci-run-id }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source-run.json
          node scripts/release-trust.mjs run source-run.json
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-bundle --dir signed-release
          node scripts/release-trust.mjs verify signed-release/release.tar.gz
          tar -xOf signed-release/release.tar.gz ./release.json > release.json
          node scripts/release-trust.mjs metadata release.json source-run.json
      - name: Connect to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configure SSH
        env:
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy and automatically recover on health failure
        run: bash scripts/ssh-deploy.sh
      - name: Deployment summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          SOURCE_RUN: ${{ inputs.ci-run-id }}
        run: |
          printf '### Staging deployment\nResult: %s\nSource CI run: %s\n' "$RESULT" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
