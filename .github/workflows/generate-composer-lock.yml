name: Generate Composer Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Generate composer.lock
        run: |
          set -euo pipefail
          # Generate metadata only; Laravel scripts require installed dependencies.
          composer update --no-install --no-scripts --no-interaction --no-ansi
          composer validate --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
